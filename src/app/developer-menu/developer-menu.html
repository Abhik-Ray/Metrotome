<div class="main-container">
  <!-- <h2>Developer Menu</h2>
  <h3>API Testing</h3> -->
  <div class="api-table-container">
    <table>
      <thead>
        <tr>
          <th colspan="2">API Endpoints</th>
          <!-- Adjusted colspan to span both columns -->
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="GET">
            <h5>GET</h5>
            <textarea
              placeholder="e.g., /users/{id} or /users?name=John"
            ></textarea>
            <button class="call-button">Call GET</button>
          </td>
          <td>
            <textarea
              class="response"
              placeholder="Response data will appear here..."
            ></textarea>
          </td>
        </tr>
        <tr>
          <td class="POST">
            <h5>POST</h5>
            <textarea
              placeholder="e.g., { 'name': 'New User', 'email': 'new@example.com' }"
            ></textarea>
            <button class="call-button">Call POST</button>
          </td>
          <td>
            <textarea
              class="response"
              placeholder="Response data will appear here..."
            ></textarea>
          </td>
        </tr>
        <tr>
          <td class="PATCH">
            <h5>PATCH</h5>
            <textarea
              placeholder="e.g., { 'id': 1, 'email': 'updated@example.com' }"
            ></textarea>
            <button class="call-button">Call PATCH</button>
          </td>
          <td>
            <textarea
              class="response"
              placeholder="Response data will appear here..."
            ></textarea>
          </td>
        </tr>
        <tr>
          <td class="DELETE">
            <h5>DELETE</h5>
            <textarea placeholder="e.g., /users/{id}"></textarea>
            <button class="call-button">Call DELETE</button>
          </td>
          <td>
            <textarea
              class="response"
              placeholder="Response data will appear here..."
            ></textarea>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
